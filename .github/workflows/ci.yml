name: .NET CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HackerNews.sln

      - name: Build
        run: dotnet build HackerNews.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HackerNews.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
